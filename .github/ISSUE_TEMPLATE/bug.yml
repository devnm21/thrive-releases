name: Report an issue
description: Something in Thrive is broken or confusing
title: Thrive issue
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Describe what happened. Leave out your code, transcript, audio, and API keys. This repository is public.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Web app
        - Mac app
        - Website
    validations:
      required: true
  - type: input
    id: github_login
    attributes:
      label: GitHub login
      description: Filled in by the app when you are signed in. This repository is public.
      placeholder: octocat
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings. Example 0.1.0-alpha.1
      placeholder: 0.1.0-alpha.1
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
